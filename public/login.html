<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Catálogo</title>
    
    <meta name="theme-color" content="#039be5"/>
    <link rel="manifest" href="/manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center min-h-screen">

    <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-gray-900 dark:text-white mb-2">Catálogo de Minerales</h1>
        <p class="text-center text-gray-500 dark:text-gray-400 mb-6">Inicia sesión o regístrate para continuar</p>

        <form id="authForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Correo Electrónico</label>
                <input type="email" id="email" required autocomplete="email" class="mt-1 block w-full bg-gray-50 dark:bg-gray-700 border-gray-300 rounded-md shadow-sm py-2 px-3 text-gray-800 dark:text-gray-200">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Contraseña (mín. 6 caracteres)</label>
                <input type="password" id="password" required autocomplete="current-password" class="mt-1 block w-full bg-gray-50 dark:bg-gray-700 border-gray-300 rounded-md shadow-sm py-2 px-3 text-gray-800 dark:text-gray-200">
            </div>
            <div id="errorMessage" class="hidden text-red-500 text-sm text-center p-2 bg-red-100 dark:bg-red-900 rounded-md"></div>
            <div class="flex items-center justify-between gap-4 pt-2">
                <button type="button" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg">Iniciar Sesión</button>
                <button type="button" id="registerBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg">Registrarse</button>
            </div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { firebaseConfig } from "/firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const errorMessage = document.getElementById('errorMessage');

        const showError = (message) => {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        };
        
        const handleSuccess = () => {
            const params = new URLSearchParams(window.location.search);
            const redirectUrl = params.get('redirect') ? decodeURIComponent(params.get('redirect')) : null;
            window.location.href = redirectUrl || `${window.location.origin}/catalog.html`;
        };

        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
                handleSuccess();
            } catch (error) {
                showError("Error al iniciar sesión. Verifica tus credenciales.");
                console.error("Error de login:", error.message);
            }
        });

        registerBtn.addEventListener('click', async () => {
            try {
                await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
                handleSuccess();
            } catch (error) {
                showError("Error al registrar. La contraseña debe tener al menos 6 caracteres o el usuario ya existe.");
                console.error("Error de registro:", error.message);
            }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registrado en login.html.', reg))
                    .catch(err => console.log('Error en registro de Service Worker:', err));
            });
        }
    </script>
</body>
</html>
